name: PR validation

on:
  push:
    branches:
      - feat/audio-preload-ux-v1.7.0
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scripts/apps/vn-player-app.js
          node --check scripts/playback/vn-socket.js
          node --check tests/smoke.mjs
          node --check tests/socket-transport-smoke.mjs
          node --check tools/verify.mjs
      - name: Verify repository
        run: node tools/verify.mjs
      - name: Smoke
        run: node tests/smoke.mjs
      - name: Boot smoke
        run: node tests/boot-smoke.mjs
      - name: Runtime init smoke
        run: node tests/runtime-init-smoke.mjs
      - name: Socket transport smoke
        run: node tests/socket-transport-smoke.mjs
