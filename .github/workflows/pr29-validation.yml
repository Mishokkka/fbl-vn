name: PR 29 validation

on:
  push:
    branches:
      - feat/audio-preload-ux-v1.7.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static verification
        run: node tools/verify.mjs
      - name: Main smoke suite
        if: always()
        run: node tests/smoke.mjs
      - name: Boot smoke
        if: always()
        run: node tests/boot-smoke.mjs
      - name: Runtime init smoke
        if: always()
        run: node tests/runtime-init-smoke.mjs
      - name: Socket transport smoke
        if: always()
        run: node tests/socket-transport-smoke.mjs
