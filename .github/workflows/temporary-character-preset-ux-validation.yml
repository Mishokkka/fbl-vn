name: Temporary character preset UX validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/verify.mjs
      - run: node tests/smoke.mjs
      - run: node tests/boot-smoke.mjs
      - run: node tests/runtime-init-smoke.mjs
      - run: node tests/socket-transport-smoke.mjs
